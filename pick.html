<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Extension Options Palette</title>
    <link rel="stylesheet" href="pick.css" />
  </head>
  <body>
    <input
      type="text"
      placeholder="Search extensions"
      aria-label="Search extensions"
      aria-controls="matches"
      autocomplete="off"
      spellcheck="false"
      autofocus
    />
    <ul id="matches" role="listbox"></ul>
    <script src="pick.js"></script>
  </body>
</html>
